<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Gerador de Catálogos
    </title>
    <link rel="stylesheet" href="/assets/erpnext/css/output.css">
</head>

<body>
    <div class="container">
        <div class="mx-auto p-3 border rounded mt-4" style="max-width: 500px;">
            <div class="border p-2 mb-2 bg-light">
                CATÁLOGO {COUNTRY} V1 2024
            </div>

            <div class="border p-2 mb-2 bg-light">
                ref. {COUNTRY}-{PRICETYPE}012024
            </div>

            <div class="mb-3 small">
                em vigor a partir Fevereiro de 2024
            </div>

            <div class="mb-3">
                <select id="pais" class="form-select" aria-placeholder="Selecione o pais" aria-label="Selecione o pais">
                    <option selected value="AO">Angola</option>
                    <option value="PT">Portugal</option>
                    <option value="MZ">Mozambique</option>
                </select>
            </div>

            <div class="mb-3">
                <select id="tipo_preco" class="form-select" aria-placeholder="Selecione o tipo de preço"
                    aria-label="Selecione o tipo de preço">
                    <option selected value="PVP">PVP</option>
                    <option value="PVR">PVR</option>
                </select>
            </div>

            <div class="py-3 border-top border-bottom my-3">
                <input type="range" class="form-range" min="0" max="100" value="50" id="customRange">
            </div>

            <div class="text-center">
                <button type="button" class="btn btn-outline-primary btn-sm px-3">Optimize</button>
            </div>

            <button type="button" class="btn btn-outline-secondary w-100 mt-3" onclick="generate_all()">Full Catalog</button>
        </div>
    </div>
</body>

</html>
